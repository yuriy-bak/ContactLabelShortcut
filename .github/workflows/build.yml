name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.0-beta.1). Empty = dev build only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then T="$GITHUB_REF_NAME"; else T="$INPUT_TAG"; fi
          if [ -n "$T" ]; then V="${T#v}"; else V="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "RELEASE_TAG=$T" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Restore signing key
        run: base64 -d signing/release.jks.b64 > signing/release.jks

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "ContactLabelShortcut-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ContactLabelShortcut-${{ env.VERSION_NAME }}
          path: ContactLabelShortcut-*.apk

      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: ContactLabelShortcut-*.apk
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
