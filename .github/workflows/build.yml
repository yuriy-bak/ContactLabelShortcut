name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.0-beta.21); must be "v" + versionName. Empty = dev build only.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'

      # Also validates the Gradle wrapper
      - uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6

      - name: Version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then T="$GITHUB_REF_NAME"; else T="$INPUT_TAG"; fi
          V=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ -n "$T" ] && [ "$T" != "v$V" ]; then
            echo "::error::Tag $T does not match versionName $V in app/build.gradle.kts"
            exit 1
          fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ -n "$RELEASE_TAG" ]; then
            echo "::error::A release needs the KEYSTORE_BASE64 secret"
            exit 1
          else
            echo "::warning::No release key: the APK is signed with a debug key"
          fi

      - name: Lint, test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Lint warnings
        if: always()
        run: cat app/build/reports/lint-results.txt 2>/dev/null || true

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "ContactLabelShortcut-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk
          path: ContactLabelShortcut-*.apk

      # Lint and test reports, also when the build passes (lint warnings do not fail it)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: reports
          path: app/build/reports/

  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apk

      - uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67 # v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ContactLabelShortcut-*.apk
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.tag, '-') }}
